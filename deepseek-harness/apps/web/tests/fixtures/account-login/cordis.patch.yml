# The Web account login scenario points the shipped account provider at a loopback
# Platform double. The scenario substitutes {{origin}} after the listener binds,
# so no port is ever committed here.
- id: deepseek-account
  config:
    platformOrigin: "{{origin}}"
    allowLoopbackHttp: true
# The scenario signs in from the account menu after initial setup.
# OpenHarness ships the DeepSeek-account surfaces disabled; this scenario
# mounts them explicitly.
- id: ui-settings-account
  disabled: false
  config:
    step: done
    completion: completed
- id: llm-deepseek-account
  disabled: false
